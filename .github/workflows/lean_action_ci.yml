name: Lean Action CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  Z3_VERSION: "4.15.2"
  GLIBC_Z3: "2.39"

jobs:
  lean-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Z3
        run: |
          cd /home/runner/
          wget -q https://github.com/Z3Prover/z3/releases/download/z3-${{ env.Z3_VERSION }}/z3-${{ env.Z3_VERSION }}-x64-glibc-${{ env.GLIBC_Z3 }}.zip
          unzip -q z3-${{ env.Z3_VERSION }}-x64-glibc-${{ env.GLIBC_Z3 }}.zip
          echo "/home/runner/z3-${{ env.Z3_VERSION }}-x64-glibc-${{ env.GLIBC_Z3 }}/bin" >> "$GITHUB_PATH"
      - name: Check Z3 version
        run: z3 --version
      - uses: leanprover/lean-action@v1
      - name: Build library, unit tests, and executable explicitly
        run: lake build GhcCoreToLean ghccoretolean
      - name: Require the pinned, clean Blaster checkout
        run: python3 scripts/check_dependencies.py
      - name: Test verification result policy and orchestration
        run: python3 -m unittest discover -s tests -v

  examples:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.2.7"
      - name: Setup Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "/home/runner/.elan/bin" >> "$GITHUB_PATH"
      - name: Fix Lean version
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          elan default "$(cat lean-toolchain)"
      - name: Install Z3
        run: |
          cd /home/runner/
          wget -q https://github.com/Z3Prover/z3/releases/download/z3-${{ env.Z3_VERSION }}/z3-${{ env.Z3_VERSION }}-x64-glibc-${{ env.GLIBC_Z3 }}.zip
          unzip -q z3-${{ env.Z3_VERSION }}-x64-glibc-${{ env.GLIBC_Z3 }}.zip
          echo "/home/runner/z3-${{ env.Z3_VERSION }}-x64-glibc-${{ env.GLIBC_Z3 }}/bin" >> "$GITHUB_PATH"
      - name: Check tool versions
        run: |
          ghc --version
          cabal --version
          lake --version
          z3 --version
      - name: Build transpiler
        run: lake build GhcCoreToLean ghccoretolean
      - name: Require the pinned, clean Blaster checkout
        run: python3 scripts/check_dependencies.py
      - name: Build shim
        run: cd shim && cabal build
      - name: Check classified Haskell fixtures (including expected failures)
        run: python3 scripts/check_fixtures.py --jobs 2
      - name: Compare accepted Lean models against GHC execution
        run: python3 scripts/differential.py --report .lake/differential-results.json
      - name: Check ordered-list pilot kernel properties
        run: |
          ./verify.sh tests/pilot/data-ordlist/OrderedPilot.hs \
              --semantics conservative --json > .lake/ordlist-pilot-proof.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('.lake/ordlist-pilot-proof.json').read_text())
          theorems = [theorem for module in report['modules']
                      for block in module['properties'] for theorem in block['theorems']]
          expected = {'insert_empty', 'member_empty', 'sorted_empty'}
          if (report['status'] != 'proved' or not report['accepted']
                  or report['translationCertified'] is not False
                  or {theorem['name'].split('.')[-1] for theorem in theorems} != expected
                  or any(theorem['axioms'] for theorem in theorems)):
              raise SystemExit('Ordered-list pilot proof gate failed')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
        working-directory: vscode-extension
      - name: Verify CLI protocol through the editor runner
        run: npm run test:integration
        working-directory: vscode-extension
      - name: Prove the fidelity gate rejects a wrong arithmetic mapping
        run: |
          python3 scripts/differential.py \
              --config tests/differential-canary.json \
              --report .lake/differential-canary-baseline.json
          trap 'git restore GhcCoreToLean/Maps.lean GhcCoreToLean.lean' EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path('GhcCoreToLean/Maps.lean')
          original = '| "GHC.Num.+"     | "+"  => some "(· + ·)"'
          mutated = '| "GHC.Num.+"     | "+"  => some "(· - ·)"'
          text = path.read_text()
          if text.count(original) != 1:
              raise SystemExit('Addition mapping changed; update the fidelity canary')
          path.write_text(text.replace(original, mutated, 1))
          # Normal CI already built and checked Unit. The canary must recompile
          # production code without the guards asserting the original mapping.
          root = Path('GhcCoreToLean.lean')
          text = root.read_text()
          unit_import = 'import GhcCoreToLean.Tests.Unit\n'
          if text.count(unit_import) != 1:
              raise SystemExit('Library imports changed; update the fidelity canary')
          root.write_text(text.replace(unit_import, '', 1))
          PY
          lake build ghccoretolean
          if python3 scripts/differential.py \
              --config tests/differential-canary.json \
              --report .lake/differential-canary-results.json; then
            echo 'Wrong addition mapping passed the differential gate' >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('.lake/differential-canary-results.json').read_text())
          suites = report.get('suites', [])
          if (report.get('status') != 'failed' or report.get('phase') != 'complete'
                  or report.get('sampleCount') != 1 or report.get('matchedCount') != 0
                  or len(suites) != 1 or suites[0].get('status') != 'mismatch'
                  or len(suites[0].get('cases', [])) != 1
                  or suites[0]['cases'][0].get('status') != 'mismatch'
                  or suites[0]['cases'][0].get('ghc') != '3'
                  or suites[0]['cases'][0].get('lean') != '1'
                  or not Path(suites[0].get('generatedLeanPath', '')).is_file()):
              raise SystemExit('Canary failed for a reason other than GHC/Lean divergence')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            .lake/verification-results.json
            .lake/differential-results.json
            .lake/ordlist-pilot-proof.json
            .lake/differential-canary-baseline.json
            .lake/differential-canary-results.json
            .lake/differential-artifacts/

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
        working-directory: vscode-extension
      - run: npm test
        working-directory: vscode-extension
